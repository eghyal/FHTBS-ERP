<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paving Joss ERP Mobile — Interactive Modular Minimalist Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --canvas: #fafaf9;
      --surface: #ffffff;
      --border: #e7e5e4;
      --ink: #1c1917;
      --muted: #78716c;
      --subtle: #a8a29e;
      --crimson: #b02524;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: #161514;
      color: #f5f5f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .studio-bar {
      max-width: 980px;
      width: 100%;
      background: #22201e;
      border: 1px solid #353230;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .studio-title { font-size: 14px; font-weight: 800; letter-spacing: -0.02em; }
    .studio-sub { font-size: 11px; color: #a8a29e; font-family: var(--font-mono); margin-top: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; }
    .ctrl-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #3f3c39;
      background: #2c2927;
      color: #e7e5e4;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .ctrl-btn.active { background: #ffffff; color: #1c1917; border-color: #ffffff; }
    .workspace {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 28px;
      max-width: 980px;
      width: 100%;
      align-items: start;
    }
    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; justify-items: center; }
    }
    .phone-viewport {
      width: 390px;
      height: 812px;
      background: var(--canvas);
      color: var(--ink);
      border-radius: 28px;
      border: 1px solid #3f3c39;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    /* Login Canvas */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--canvas);
    }
    .login-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 16px 40px -16px rgba(28, 25, 23, 0.10);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .login-heading { font-size: 20px; font-weight: 800; color: var(--ink); margin-top: 12px; }
    .login-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .field-group { margin-bottom: 14px; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-box {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--canvas);
      padding: 0 14px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--ink);
      outline: none;
    }
    .input-box:focus { border-color: var(--ink); background: #fff; }
    .pw-wrap { position: relative; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; font-size: 11px; font-weight: 700;
      color: var(--muted); cursor: pointer;
    }
    .primary-btn {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: var(--ink);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .primary-btn:hover { background: #292524; }
    /* App Shell */
    .top-bar {
      height: 56px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .top-title { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 84px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mod-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-kicker {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .neutral-dash {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 800;
      color: var(--ink);
    }
    .neutral-caption { font-size: 12px; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .empty-center {
      text-align: center;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .menu-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .menu-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      border-top: 1px solid #f5f5f4;
    }
    .logout-btn {
      width: 100%;
      height: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      color: var(--crimson);
      cursor: pointer;
    }
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(255,255,255,0.98);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .nav-btn {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--subtle);
      cursor: pointer;
    }
    .nav-btn.active { color: var(--ink); font-weight: 700; }
    .notes-panel {
      background: #22201e;
      border: 1px solid #353230;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .notes-panel h2 { font-size: 15px; font-weight: 800; }
    .spec-box {
      background: #171615;
      border: 1px solid #2e2c2a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      line-height: 1.65;
      color: #d6d3d1;
    }
    .spec-box strong { color: #ffffff; }
  </style>
</head>
<body>
  <div class="studio-bar">
    <div>
      <div class="studio-title">Paving Joss ERP Mobile — UI/UX Interactive Blueprint</div>
      <div class="studio-sub">Modular Minimalist Card · Official Web ERP Logo · Zero-Data Empty Build</div>
    </div>
    <div class="controls">
      <button class="ctrl-btn active" onclick="openRoute('login')" id="btn-login">0. Login</button>
      <button class="ctrl-btn" onclick="openTab('dashboard')" id="btn-dashboard">1. Dashboard (Default)</button>
      <button class="ctrl-btn" onclick="openTab('messages')" id="btn-messages">2. Messages</button>
      <button class="ctrl-btn" onclick="openTab('shopfloor')" id="btn-shopfloor">3. Shop Floor</button>
      <button class="ctrl-btn" onclick="openTab('profile')" id="btn-profile">4. Profile/Hub</button>
    </div>
  </div>

  <div class="workspace">
    <div class="phone-viewport" id="phone"></div>

    <aside class="notes-panel">
      <h2>Spesifikasi Layar Aktif</h2>
      <div class="spec-box" id="specNotes"></div>
    </aside>
  </div>

  <script>
    let currentRoute = 'login';
    let currentTab = 'dashboard';
    let showPw = false;

    function logoMarkup(size) {
      return `
        <img src="../assets/logo.png" alt="Web ERP Logo"
             style="width:${size}px;height:${size}px;object-fit:contain;display:block;"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
        <svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px;display:none;" aria-label="Web ERP Logo">
          <path d="M12 28 L26 16 L66 16 C82 16 88 28 84 42 C80 54 68 62 56 64 L56 49 C64 47 70 42 70 34 C70 28 65 26 58 26 L12 28 Z" fill="#CC0000"/>
          <path d="M52 38 L62 30 L62 72 L48 84 L34 84 L24 72 L24 58 L35 49 L35 68 L41 74 L48 74 L52 68 Z" fill="#F59E0B"/>
        </svg>
      `;
    }

    const SPECS = {
      login: `<strong>Layar 0 · Halaman Login Minimalis</strong><br>• Kanvas latar hangat <code>#FAFAF9</code> dengan kartu putih terpusat (<code>radius 24px</code>, border <code>1px #E7E5E4</code>).<br>• Menggunakan <strong>logo grafis resmi PJ Web ERP</strong> (<code>../assets/logo.png</code>).<br>• Hanya 2 input bersih (<strong>Username</strong> & <strong>Password</strong>) + 1 tombol utama <strong>Masuk</strong>.<br>• Ketuk <strong>Masuk</strong> untuk langsung mendarat pada tab default <strong>Dashboard</strong>.`,
      dashboard: `<strong>Tab 1 (Default Paling Kiri) · Dashboard</strong><br>• Pengganti nama <em>HR Portal</em>, menjadi halaman utama setelah Login.<br>• Seluruh kartu modular dibangun dalam kondisi <strong>kosong netral</strong> (simbol <code>—</code>, status <em>Belum tercatat / Belum ada data</em>).<br>• Nol data dummy: siap disambungkan ke API Web ERP pada Fase Terakhir.`,
      messages: `<strong>Tab 2 · Messages</strong><br>• Kolom pencarian bersih di atas kartu empty-state tunggal.<br>• Tidak ada daftar chat palsu atau notifikasi fiktif saat aplikasi pertama kali terbuild.`,
      shopfloor: `<strong>Tab 3 · Shop Floor</strong><br>• Kartu modular <strong>Workstation Aktif</strong>, grid 2 kolom <strong>Target / Hasil</strong>, dan <strong>Antrian Produksi</strong>.<br>• Seluruh slot nilai menampilkan <code>—</code> secara netral sebelum koneksi backend.`,
      profile: `<strong>Tab 4 · Profile / Hub</strong><br>• Kartu identitas pengguna netral (avatar kosong + <code>—</code> + status <em>Belum terhubung ke akun ERP</em>).<br>• Daftar pengaturan dasar dan tombol <strong>Keluar</strong> untuk kembali ke halaman Login.`
    };

    function iconSvg(name, active) {
      const stroke = active ? '#1C1917' : '#A8A29E';
      const sw = active ? '2.2' : '1.8';
      const map = {
        dashboard: `<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>`,
        messages: `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>`,
        shopfloor: `<path d="M2 20h20"/><path d="M4 20V8l5 3V8l5 3V4h6v16"/>`,
        profile: `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`
      };
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${map[name]}</svg>`;
    }

    function openRoute(route) {
      currentRoute = route;
      if (route === 'shell') currentTab = 'dashboard';
      render();
    }

    function openTab(tab) {
      currentRoute = 'shell';
      currentTab = tab;
      render();
    }

    function togglePw() {
      showPw = !showPw;
      const input = document.getElementById('pwInput');
      const btn = document.getElementById('pwToggleBtn');
      if (input && btn) {
        input.type = showPw ? 'text' : 'password';
        btn.textContent = showPw ? 'Tutup' : 'Lihat';
      }
    }

    function render() {
      const phone = document.getElementById('phone');
      const key = currentRoute === 'login' ? 'login' : currentTab;
      document.getElementById('specNotes').innerHTML = SPECS[key];

      ['login', 'dashboard', 'messages', 'shopfloor', 'profile'].forEach((id) => {
        const btn = document.getElementById('btn-' + id);
        if (btn) btn.classList.toggle('active', id === key);
      });

      if (currentRoute === 'login') {
        phone.innerHTML = `
          <div class="login-wrap">
            <div class="login-card">
              <div class="login-brand">
                ${logoMarkup(64)}
                <div class="login-heading">Masuk ke Akun</div>
                <div class="login-sub">Portal Operasional Mobile</div>
              </div>
              <div class="field-group">
                <label class="field-label">Username</label>
                <input class="input-box" type="text" placeholder="Masukkan username" />
              </div>
              <div class="field-group">
                <label class="field-label">Password</label>
                <div class="pw-wrap">
                  <input id="pwInput" class="input-box" type="${showPw ? 'text' : 'password'}" placeholder="Masukkan password" style="padding-right:52px;" />
                  <button id="pwToggleBtn" type="button" class="pw-toggle" onclick="togglePw()">${showPw ? 'Tutup' : 'Lihat'}</button>
                </div>
              </div>
              <button type="button" class="primary-btn" onclick="openTab('dashboard')">Masuk</button>
            </div>
          </div>
        `;
        return;
      }

      const titles = {
        dashboard: 'Dashboard',
        messages: 'Messages',
        shopfloor: 'Shop Floor',
        profile: 'Profile / Hub'
      };

      let bodyHtml = '';
      if (currentTab === 'dashboard') {
        bodyHtml = `
          <div class="mod-card">
            <div class="card-kicker">Presensi Hari Ini</div>
            <div class="empty-center" style="padding:10px 0;">
              <div class="neutral-dash">—</div>
              <div class="neutral-caption">Belum tercatat</div>
            </div>
            <button type="button" class="primary-btn" style="margin-top:0;">Catat Kehadiran</button>
          </div>
          <div class="grid-2">
            <div class="mod-card">
              <div class="card-kicker">Kuota Cuti</div>
              <div class="neutral-dash" style="font-size:22px;">—</div>
              <div class="neutral-caption">Belum ada data</div>
            </div>
            <div class="mod-card">
              <div class="card-kicker">Slip Gaji</div>
              <div class="neutral-dash" style="font-size:22px;">—</div>
              <div class="neutral-caption">Belum tersedia</div>
            </div>
          </div>
          <div class="mod-card">
            <div class="card-kicker">Aktivitas Terbaru</div>
            <div class="empty-center">
              <div class="neutral-caption">Belum ada riwayat aktivitas</div>
            </div>
          </div>
        `;
      } else if (currentTab === 'messages') {
        bodyHtml = `
          <input class="input-box" style="background:#fff;height:44px;" placeholder="Cari percakapan..." />
          <div class="mod-card">
            <div class="empty-center" style="padding:44px 12px;">
              <div style="font-size:15px;font-weight:700;color:var(--ink);">Belum ada percakapan</div>
              <div class="neutral-caption">Pesan tim akan tampil di sini setelah terhubung dengan sistem.</div>
            </div>
          </div>
        `;
      } else if (currentTab === 'shopfloor') {
        bodyHtml = `
          <div class="mod-card">
            <div class="card-kicker">Workstation Aktif</div>
            <div class="neutral-caption" style="font-size:13px;color:#44403C;">— &nbsp;·&nbsp; Belum ada stasiun kerja dipilih</div>
          </div>
          <div class="grid-2">
            <div class="mod-card">
              <div class="card-kicker">Target</div>
              <div class="neutral-dash" style="font-size:22px;">—</div>
            </div>
            <div class="mod-card">
              <div class="card-kicker">Hasil</div>
              <div class="neutral-dash" style="font-size:22px;">—</div>
            </div>
          </div>
          <div class="mod-card">
            <div class="card-kicker">Antrian Produksi</div>
            <div class="empty-center">
              <div class="neutral-caption">Belum ada tugas produksi aktif</div>
            </div>
          </div>
        `;
      } else {
        bodyHtml = `
          <div class="mod-card">
            <div class="card-kicker">Identitas Pengguna</div>
            <div style="display:flex;align-items:center;gap:14px;padding-top:4px;">
              <div style="width:48px;height:48px;border-radius:999px;background:#e7e5e4;flex-shrink:0;"></div>
              <div>
                <div style="font-size:16px;font-weight:700;">—</div>
                <div class="neutral-caption">Belum terhubung ke akun ERP</div>
              </div>
            </div>
          </div>
          <div class="menu-list">
            <div style="padding:14px 16px 6px 16px;"><div class="card-kicker">Akses Modul</div></div>
            <div class="menu-row"><span>Preferensi Tampilan</span><span style="color:#a8a29e;">›</span></div>
            <div class="menu-row"><span>Informasi Aplikasi</span><span style="color:#a8a29e;">›</span></div>
            <div class="menu-row"><span>Tentang Sistem</span><span style="color:#a8a29e;">›</span></div>
          </div>
          <button type="button" class="logout-btn" onclick="openRoute('login')">Keluar</button>
        `;
      }

      const tabs = [
        { id: 'dashboard', label: 'Dashboard' },
        { id: 'messages', label: 'Messages' },
        { id: 'shopfloor', label: 'Shop Floor' },
        { id: 'profile', label: 'Profile/Hub' }
      ];

      phone.innerHTML = `
        <header class="top-bar">
          ${logoMarkup(28)}
          <div class="top-title">${titles[currentTab]}</div>
        </header>
        <main class="content-scroll">${bodyHtml}</main>
        <nav class="bottom-nav">
          ${tabs.map(t => `
            <button type="button" class="nav-btn ${currentTab === t.id ? 'active' : ''}" onclick="openTab('${t.id}')">
              ${iconSvg(t.id, currentTab === t.id)}
              <span>${t.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    render();
  </script>
</body>
</html>
